*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
.side{width:236px;background:linear-gradient(180deg,#16487E,#1C75BC);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 15px 12px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;gap:10px;align-items:center}
.brand .lg{width:40px;height:40px;border-radius:9px;background:#fff;padding:3px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:13.5px;display:block;color:#fff}.brand small{color:#bfe3f7;font-size:9px;font-weight:600;letter-spacing:.04em}
.side nav{padding:6px;flex:1}.nsec{padding:10px 13px 3px;font-size:9px;color:#8fb8dd;letter-spacing:.09em;font-weight:800}
.side button{width:100%;text-align:left;background:none;border:none;color:#cfe4f7;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;gap:9px;align-items:center;margin-bottom:1px}
.side button:hover{background:rgba(255,255,255,.12);color:#fff}.side button.active{background:#8DC63F;color:#0b3a17}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:3px solid #8DC63F;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.top h2{font-size:16px;color:var(--navy)}.top .clock{margin-left:auto;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.wrap{padding:20px 22px;max-width:1520px}.page{display:none}.page.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.kpi .v{font-size:24px;font-weight:800}.kpi .l{font-size:11px;color:var(--mut);margin-top:4px;font-weight:600}.kpi .b{position:absolute;left:0;top:0;bottom:0;width:5px}.kpi .t{font-size:10px;margin-top:4px;color:var(--mut);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}

label{font-size:11px;color:var(--mut);font-weight:600;display:block;margin-bottom:5px}

.step{display:flex;gap:10px}.step .mk{width:23px;height:23px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.step .ln{flex:1;padding-bottom:12px;border-left:2px solid var(--line);margin-left:11px;padding-left:16px;margin-top:-4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px}

.bar2{height:8px;background:var(--slate);border-radius:5px;overflow:hidden;min-width:64px}.bar2 i{display:block;height:100%;border-radius:5px}

const scls=s=>s>=90?'g':s>=85?'a':'r';
function scases(k){return cases.filter(c=>c.stream==k)}
function isClosed(c){return c.stageIdx>=STREAMS[c.stream].stages.length-1}
function stagePill(c){const S=STREAMS[c.stream];const nm=sStage(c.stream,c.stageIdx);const cl=isClosed(c)?'g':c.stageIdx==0?'b':c.stageIdx>=S.stages.length-3?'v':'a';return `<span class="pill bg-${cl}">${nm}</span>`}

// modeled per-stream kpi
function skpi(k){const cs=scases(k);const closed=cs.filter(isClosed).length;const seed=[...k].reduce((a,c)=>a+c.charCodeAt(0),0);
 return {total:cs.length,closed,open:cs.length-closed,comp:cs.length?Math.round(closed/cs.length*100):0,sla:82+seed%14,avg:(STREAMS[k].sla*(0.55+ (seed%20)/100)).toFixed(1)};}

 const nm=sStage(c.stream,c.stageIdx);toast((isClosed(c)?'&#9989; '+c.id+' &mdash; '+sStage(c.stream,c.stageIdx)+' ('+sLabel(c.stream)+')':'&#9656; '+c.id+' &rarr; '+nm));render('s_'+c.stream);}

function recompInv(r){r.cover=r.monthly?Math.round(r.onhand/r.monthly*10)/10:0;r.status=(r.onhand<r.reorder*0.4||r.exp<30)?'Critical':r.onhand<r.reorder?'Low':r.exp<60?'Expiring':'OK';}
function vCenter(w){V.inv.forEach(recompInv);V.units.forEach(u=>u.status=(u.temp<u.min||u.temp>u.max)?'Breach':'OK');
 const adm=V.due.reduce((s,d)=>s+d.administered,0),due=V.due.reduce((s,d)=>s+d.due,0),cov=(adm/due*100).toFixed(1);
 const alerts=V.inv.filter(r=>r.status!='OK').length,breaches=V.units.filter(u=>u.status=='Breach').length;
 const oh=V.inv.reduce((s,r)=>s+r.onhand,0),dem=V.inv.reduce((s,r)=>s+r.monthly,0);
 const k=[['Doses Administered',fmt(adm),'var(--green)','this month'],['Coverage %',cov+'%',cov>=90?'var(--green)':'var(--amber)','MOH 95%'],['Stock Alerts',alerts,alerts?'var(--amber)':'var(--green)','auto-calc'],['Cold-Chain Breaches',breaches,breaches?'var(--red)':'var(--green)','auto-calc'],['Months of Cover',(oh/dem).toFixed(1),'var(--violet)','network'],['Vaccination Cases',scases('vaccination').length,'var(--blue)','pipeline']];
 w.innerHTML=`<div class="kpis">${k.map(x=>`<div class="kpi"><div class="b" style="background:${x[2]}"></div><div class="v">${x[1]}</div><div class="l">${x[0]}</div><div class="t">${x[3]}</div></div>`).join('')}</div>
 <p class="s" style="color:var(--mut);margin-bottom:8px">All KPIs &amp; statuses recompute automatically from the data you enter in Inventory &amp; Cold Chain.</p>
 <div class="grid2"><div class="card"><h3>Coverage by City</h3><div class="chart"><canvas id="vcCov"></canvas></div></div><div class="card"><h3>Inventory Status</h3><div class="chart"><canvas id="vcSt"></canvas></div></div></div>`;
 const CO={maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5e7a96'}},y:{ticks:{color:'#5e7a96'}}}};

function vFc(w){V.inv.forEach(recompInv);const cityDem={},cityOh={};D.cities.forEach(c=>{cityDem[c]=V.inv.filter(r=>r.city==c).reduce((s,r)=>s+r.monthly,0);cityOh[c]=V.inv.filter(r=>r.city==c).reduce((s,r)=>s+r.onhand,0);});
 const disp=[];[...new Set(V.inv.map(r=>r.code))].forEach(code=>{const rows=V.inv.filter(r=>r.code==code);const def=rows.filter(r=>r.cover<1),sur=rows.filter(r=>r.cover>2.5).sort((a,b)=>b.cover-a.cover);def.forEach(d=>{if(sur[0])disp.push({code,to:d.city,from:sur[0].city,qty:Math.max(10,Math.round(d.monthly*1.5-d.onhand))});});});

 <div class="card"><h3>&#128666; Inter-City Dispatch (auto from your data)</h3><div class="tw" style="max-height:none"><table><thead><tr><th>Vaccine</th><th>To</th><th>From</th><th>Qty</th><th></th></tr></thead><tbody>${disp.map(d=>`<tr><td><b>${d.code}</b></td><td>${d.to}</td><td>${d.from}</td><td>${d.qty}</td><td><button class="btn sm gr" onclick="toast('&#128666; Dispatched ${d.qty} ${d.code}: ${d.from} &rarr; ${d.to}')">Dispatch</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--mut)">Balanced &#10003;</td></tr>'}</tbody></table></div></div>`;

function vElig(w){
 const Q=[['q1','Child age matches a due package (MOH)?',['Yes','No']],['q2','Prior doses up to date?',['Yes','No — catch-up needed']],['q3','Fever ≥ 38°C right now?',['No','Yes']],['q4','Acute illness (cough/sneezing/diarrhoea)?',['No','Mild','Moderate–Severe']],['q5','Known severe allergy to a vaccine component?',['No','Yes']],['q6','Immunocompromised / high-dose steroids?',['No','Yes']]];
 w.innerHTML=`<div class="card" style="max-width:720px"><h3>&#9989; Vaccine Eligibility Screening</h3><p class="s" style="color:var(--mut);margin-bottom:12px">Complete before requesting/ordering a childhood vaccine.</p>
 ${Q.map(q=>`<div style="margin-bottom:11px"><label>${q[1]}</label><select id="${q[0]}">${q[2].map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}

function checkElig(){const g=id=>el(id).value;const reasons=[];
 if(g('q1')=='No')reasons.push('Not within a due MOH package window');
 if(g('q3')=='Yes')reasons.push('Active fever ≥38°C — defer until afebrile');
 if(g('q4')=='Moderate–Severe')reasons.push('Moderate–severe acute illness — defer');
 if(g('q5')=='Yes')reasons.push('Severe allergy to component — specialist referral');
 if(g('q6')=='Yes')reasons.push('Immunocompromised — review live vaccines with physician');
 const catchup=g('q2').startsWith('No');
 if(reasons.length){el('eligres').innerHTML=`<div class="banner no">&#10060; Not eligible now &mdash; defer.<br>${reasons.map(r=>'• '+r).join('<br>')}</div>`;}
 else{el('eligres').innerHTML=`<div class="banner ok">&#9989; Eligible for vaccination${catchup?' (catch-up schedule flagged)':''}. <br><button class="btn gr" style="margin-top:8px" onclick="vNew('vaccination')">Proceed to Order Vaccine &#10148;</button></div>`;}
}
